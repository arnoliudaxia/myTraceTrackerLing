<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>灵敢足迹 - 地理路径可视化</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel=stylesheet href=styles.css>
</head>
<body>
    <div id="map"></div>
    <div class="control-panel">
        <h2>📍 灵敢足迹可视化</h2>
        <div class="label-selector">
            <label>🏷️ 标签:</label>
            <div id="labelGrid" class="label-grid"></div>
            <div class="label-editor">
                <input id="labelInput" type="text" placeholder="给选中路径打标签">
                <button type="button" onclick="applyLabelToSelectedSegments()">应用</button>
                <button type="button" onclick="savePathLabels()">保存</button>
            </div>
        </div>
        <div id="labelModeHint" class="mode-hint">标签模式：日期选择暂时无效</div>
        <div id="dateSelectorPanel" class="date-selector">
            <label>📅 选择日期:</label>
            <div class="calendar">
                <div class="calendar-header">
                    <button type="button" class="calendar-nav" onclick="changeCalendarMonth(-1)" title="上个月">‹</button>
                    <div id="calendarTitle" class="calendar-title"></div>
                    <button type="button" class="calendar-nav" onclick="changeCalendarMonth(1)" title="下个月">›</button>
                </div>
                <div class="calendar-weekdays">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>
            <select id="dateSelect" onchange="changeDate()">
        <option value="2020-08-31">2020-08-31 (16个点, 17:58:21-21:46:33)</option>
        <option value="2021-07-23">2021-07-23 (11个点, 15:33:40-16:49:16)</option>

        <option value="2023-12-15">2023-12-15 (59个点, 02:02:26-18:46:36)</option>

        <option value="2023-12-25">2023-12-25 (36个点, 20:21:28-23:39:08)</option>
        <option value="2023-12-28">2023-12-28 (23个点, 16:11:21-18:46:01)</option>
        <option value="2024-02-13">2024-02-13 (49个点, 15:20:33-15:21:22)</option>

        <option value="2026-04-24">2026-04-24 (179个点, 01:09:05-21:36:32)</option>
        <option value="2026-05-01" selected>2026-05-01 (212个点, 17:29:27-18:08:32)</option>
            </select>
        </div>
        <div class="coord-info">📌 已启用坐标纠正（国内APP数据→WGS84）</div>
        <button id="speedToggle" class="mode-button" type="button" onclick="toggleSpeedMode()">速度路径：关闭</button>
        <button id="dataPointToggle" class="mode-button point-toggle" type="button" onclick="toggleDataPoints()">数据点：关闭</button>
        <div class="segment-selector">
            <label>🧭 路径段:</label>
            <div id="segmentGrid" class="segment-grid"></div>
            <div class="dim-opacity-control">
                <label for="dimOpacityRange">弱化透明度: <span id="dimOpacityValue">30%</span></label>
                <input id="dimOpacityRange" type="range" min="5" max="80" step="5" value="30" oninput="changeDimOpacity()">
            </div>
        </div>
        <div class="quick-labels">
            <div class="quick-label-title">快捷打标签</div>
            <div id="quickLabelGrid" class="quick-label-grid"></div>
        </div>
        <div class="favorite-panel">
            <label>⭐ 收藏夹:</label>
            <div class="favorite-editor">
                <textarea id="favoriteNoteInput" rows="2" placeholder="为选中路径添加备注"></textarea>
                <button type="button" onclick="favoriteSelectedSegments()">收藏选中路径</button>
            </div>
            <div id="favoriteSaveStatus" class="favorite-save-status"></div>
            <div id="favoriteList" class="favorite-list"></div>
        </div>
        <div class="tile-selector">
            <label>🗺️ 地图源:</label>
            <select id="tileSelect" onchange="changeTile()">
                <option value="osm" selected>OpenStreetMap</option>
                <option value="tracestrack">Tracestrack 瓦片</option>
                <option value="satellite">卫星地图-Esri World Imagery</option>
                <option value="tiandituSatellite">卫星地图-天地图</option>
                <option value="geovisSatellite">卫星地图-星图地球影像</option>
            </select>
        </div>
        <div class="info-grid">
            <div class="info-item">
                <div class="label">轨迹点数</div>
                <div class="value" id="pointCount">-</div>
            </div>
            <div class="info-item">
                <div class="label">时间段</div>
                <div class="value" id="timeRange">-</div>
            </div>
            <div class="info-item">
                <div class="label">海拔范围</div>
                <div class="value" id="altitudeRange">-</div>
            </div>
            <div class="info-item">
                <div class="label">速度范围</div>
                <div class="value" id="speedRange">-</div>
            </div>
            <div class="info-item">
                <div class="label">路径段数</div>
                <div class="value" id="segmentCount">-</div>
            </div>
        </div>
    </div>
    <div class="legend">
        <div style="font-weight:bold; margin-bottom:8px;">图例</div>
        <div class="legend-item"><span class="legend-color" style="background:#3388ff;"></span>移动轨迹</div>
        <div id="metricLegend" class="metric-legend">
            <div id="metricLegendTitle" style="font-weight:bold;">可视化路径</div>
            <div class="metric-gradient"></div>
            <div class="metric-scale"><span id="metricMinLabel">低</span><span id="metricMaxLabel">高</span></div>
        </div>
    </div>
    <div class="stats-panel">
        📊 总日期数: 61 | 总记录数: 6055
    </div>
    <div class="admin-panel">
        <h3>行政区划</h3>
        <div class="admin-search">
            <input id="adminSearchInput" type="text" placeholder="输入省、市、区县或街镇">
            <button type="button" onclick="searchAdminBoundaries()">搜索</button>
        </div>
        <select id="adminBoundarySelect" onchange="showSelectedAdminBoundary()">
            <option value="">先搜索行政区划</option>
        </select>
        <div class="admin-actions">
            <button type="button" onclick="clearAdminBoundary()">清除范围</button>
        </div>
        <div class="admin-cascade">
            <div class="admin-section-title">上海市多级选择</div>
            <select id="shanghaiDistrictSelect" onchange="changeShanghaiDistrict()">
                <option value="">正在加载区划...</option>
            </select>
            <select id="shanghaiTownSelect" onchange="showSelectedShanghaiBoundary()">
                <option value="">先选择区</option>
            </select>
            <div class="admin-actions">
                <button type="button" onclick="showSelectedShanghaiDistrict()">显示区范围</button>
            </div>
        </div>
        <div id="adminBoundaryStatus" class="admin-status">数据源：OpenStreetMap</div>
        <div id="adminBoundaryMeta" class="admin-meta"></div>
    </div>
    <script src=app.js></script>
</body>
</html>
